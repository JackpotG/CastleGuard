<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CastleGuard 配置工具</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/preview-model.js" defer></script>
  <script src="/monster-visual.js" defer></script>
  <script src="/upgrade-editor.js" defer></script>
  <script src="/tree-position.js" defer></script>
  <script src="/tree-router-runtime.js" defer></script>
  <script src="/tree-routing.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">CG</span><span>CastleGuard</span><span class="brand-sub">配置工具</span></div>
      <nav class="mode-switch" aria-label="配置类型">
        <button id="mode-levels" class="mode-button active" type="button">关卡配置</button>
        <button id="mode-tree" class="mode-button" type="button">技能树配置</button>
        <button id="mode-balance" class="mode-button" type="button">基础数值</button>
      </nav>
      <div class="top-actions">
        <span id="save-state" class="save-state">已同步</span>
        <button id="reload-button" class="icon-button" type="button" title="重新载入" aria-label="重新载入">↻</button>
        <button id="save-button" class="primary-button" type="button">保存配置</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="sidebar">
        <div id="sidebar-head" class="sidebar-head"></div>
        <div id="sidebar-list" class="sidebar-list"></div>
      </aside>
      <main id="main-content" class="main-content"></main>
      <aside id="inspector" class="inspector"></aside>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <div id="level-preview" class="preview-overlay" role="dialog" aria-modal="true" aria-label="关卡出怪预览" hidden></div>
</body>
</html>
